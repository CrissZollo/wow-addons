<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="mobile-web-app-capable" content="yes">
<title>Herald</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
:root {
  --bg: #14161c; --card: #1d2029; --card2: #252935; --line: #2f3442;
  --text: #e9e6dc; --dim: #9a9eab; --gold: #ffd100; --accent: #ffd100;
  --good: #3ddc84; --bad: #ff6b6b; --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px; }
.muted { color: var(--dim); }
.small { font-size: 13px; }

/* character switcher */
.chars { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
.chars::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px;
  border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--dim); font-size: 14px; }
.chip img { width: 22px; height: 22px; border-radius: 50%; }
.chip.on { color: var(--text); border-color: var(--c, var(--accent)); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good); }

/* hero */
.hero { background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, var(--card)) 0%, var(--card) 60%);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.hero-top { display: flex; gap: 14px; align-items: center; }
.hero-top img { width: 56px; height: 56px; border-radius: 12px; border: 2px solid var(--c); }
.hero h1 { margin: 0; font-size: 24px; line-height: 1.1; color: var(--c); }
.lvl { font-size: 30px; font-weight: 700; margin-left: auto; text-align: right; line-height: 1; }
.lvl small { display: block; font-size: 11px; font-weight: 500; color: var(--dim); letter-spacing: .08em; }
.bar { height: 10px; border-radius: 6px; background: #0e1015; overflow: hidden; position: relative; margin-top: 14px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #8a5cf6, #b388ff); border-radius: 6px; }
.bar i.rest { background: rgba(80, 160, 255, .35); }
.bar-label { display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; color: var(--dim); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px;
  border-radius: 999px; background: var(--card2); color: var(--dim); }
.pill.live { color: var(--good); }
.coin { display: inline-flex; gap: 6px; font-variant-numeric: tabular-nums; }
.g { color: #ffd100; } .s { color: #c7c7cf; } .c { color: #d08a4a; }

/* sections */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 12px; }
.card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600;
  display: flex; justify-content: space-between; align-items: baseline; }
.card h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--dim); }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .side { color: var(--dim); font-size: 13px; text-align: right; white-space: nowrap; }
.slot { width: 74px; flex: none; color: var(--dim); font-size: 13px; }
.motd { background: var(--card2); border-left: 3px solid var(--good); padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
input[type=search] { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; font: inherit; margin-bottom: 6px; }
.more { display: block; width: 100%; background: none; border: 0; color: var(--accent); font: inherit; padding: 10px 0 0; }
.empty { color: var(--dim); text-align: center; padding: 18px 8px; font-size: 14px; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--card2); color: var(--dim); margin-left: 6px; }
.tag.boss { color: #ff8000; } .tag.pvp { color: var(--bad); }

/* tabs */
nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20, 22, 28, .94); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; max-width: 140px; background: none; border: 0; color: var(--dim); font: inherit; font-size: 12px;
  padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button svg { width: 24px; height: 24px; }
nav button.on { color: var(--accent); }
.foot { text-align: center; color: var(--dim); font-size: 12px; margin-top: 16px; }

/* widget mode: one compact card that fills the widget */
body.widget { padding: 0; background: transparent; }
body.widget .wrap { padding: 0; max-width: none; }
body.widget .hero { border-radius: 18px; min-height: 100vh; padding: 14px; }
body.widget .chars, body.widget nav, body.widget .card, body.widget .foot { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="chars" id="chars"></div>
  <div id="hero"></div>
  <div id="tab"></div>
  <div class="foot" id="foot"></div>
</div>
<nav id="nav">
  <button data-tab="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-tab="gear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Gear</button>
  <button data-tab="guild"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 010 7M22 20c0-3-1.5-5-4-5.7"/></svg>Guild</button>
  <button data-tab="kills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg>Kills</button>
</nav>
<script>
"use strict";
const CLASS_COLORS = { WARRIOR: "#C69B6D", PALADIN: "#F48CBA", HUNTER: "#AAD372", ROGUE: "#FFF468", PRIEST: "#FFFFFF",
  SHAMAN: "#0070DD", MAGE: "#3FC7EB", WARLOCK: "#8788EE", DRUID: "#FF7C0A", DEATHKNIGHT: "#C41E3A",
  MONK: "#00FF98", DEMONHUNTER: "#A330C9", EVOKER: "#33937F" };
const QUALITY = ["#9d9d9d", "#ffffff", "#1eff00", "#0070dd", "#a335ee", "#ff8000", "#e6cc80", "#00ccff"];
const widgetMode = location.pathname.startsWith("/widget");
const params = new URLSearchParams(location.search);
let data = null, guildLimit = 25, guildQuery = "";
let state = { char: params.get("char") || load("char"), tab: load("tab") || "overview" };

function load(k) { try { return localStorage.getItem("herald." + k); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem("herald." + k, v); } catch (e) {} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => n == null ? "–" : Math.round(n).toLocaleString();

function money(copper) {
  if (copper == null) return "–";
  copper = Math.abs(copper);
  const g = Math.floor(copper / 10000), s = Math.floor(copper / 100) % 100, c = copper % 100;
  let out = "";
  if (g) out += `<span class="g">${g.toLocaleString()}g</span>`;
  if (s || g) out += `<span class="s">${s}s</span>`;
  out += `<span class="c">${c}c</span>`;
  return `<span class="coin">${out}</span>`;
}

function ago(t) {
  if (!t) return "";
  const sec = Math.max(0, Date.now() / 1000 - t);
  if (sec < 90) return "just now";
  if (sec < 3600) return Math.round(sec / 60) + " min ago";
  if (sec < 86400) return Math.round(sec / 3600) + " h ago";
  return Math.round(sec / 86400) + " d ago";
}
function away(sec) {
  if (sec == null) return "";
  if (sec < 3600) return "<1 h";
  if (sec < 86400) return Math.round(sec / 3600) + " h";
  return Math.round(sec / 86400) + " d";
}

function current() {
  const cs = data.characters;
  return cs.find(c => c.key === state.char) || cs.find(c => c.name.toLowerCase() === (state.char || "").toLowerCase()) || cs[0];
}

function renderChars() {
  const el = document.getElementById("chars");
  if (data.characters.length < 2) { el.innerHTML = ""; return; }
  const cur = current();
  el.innerHTML = data.characters.map(c => `
    <button class="chip ${c === cur ? "on" : ""}" style="--c:${c.color}" data-key="${esc(c.key)}">
      <img src="${esc(c.classIcon)}" alt="" onerror="this.style.visibility='hidden'">${esc(c.name)} <span class="muted">${c.level ?? ""}</span>
      ${c.playing ? '<span class="dot" title="In game"></span>' : ""}
    </button>`).join("");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    state.char = b.dataset.key; save("char", state.char); guildLimit = 25; render();
  });
}

function renderHero(c) {
  const xpPct = c.xpMax ? Math.min(100, 100 * c.xp / c.xpMax) : null;
  const restPct = c.xpMax && c.rested ? Math.min(100 - xpPct, 100 * c.rested / c.xpMax) : 0;
  const status = c.playing
    ? `<span class="pill live"><span class="dot"></span>In game${data.playing.zone ? " · " + esc(data.playing.zone) : ""}</span>`
    : `<span class="pill">Saved ${esc(ago(c.t))}</span>`;
  const g = c.guild;
  document.getElementById("hero").innerHTML = `
  <div class="hero" style="--c:${c.color}">
    <div class="hero-top">
      <img src="${esc(c.classIcon)}" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <h1>${esc(c.name)}</h1>
        <div class="muted small">${esc(c.race)} ${esc(c.className)}${g ? ` · &lt;${esc(g.name)}&gt;` : ""}</div>
      </div>
      <div class="lvl">${c.level ?? "?"}<small>LEVEL</small></div>
    </div>
    ${xpPct != null ? `
    <div class="bar"><i class="rest" style="left:${xpPct}%;width:${restPct}%"></i><i style="width:${xpPct}%"></i></div>
    <div class="bar-label"><span>${num(c.xp)} / ${num(c.xpMax)} XP</span><span>${xpPct.toFixed(0)}%${c.rested ? ` · ${num(c.rested)} rested` : ""}</span></div>` : ""}
    <div class="facts">
      <span>${money(c.money)}</span>
      ${c.zone ? `<span>📍 ${esc(c.zone)}</span>` : ""}
      ${c.ilvl ? `<span>🛡️ ilvl ${c.ilvl}</span>` : ""}
      ${widgetMode && g ? `<span>👥 ${g.onlineCount} online</span>` : ""}
    </div>
    <div class="facts">${status}</div>
  </div>`;
}

function renderOverview(c) {
  const stats = [];
  if (c.health) stats.push(["Health", num(c.health)]);
  if (c.power) stats.push([c.powerType || "Power", num(c.power)]);
  c.stats.forEach(s => stats.push([s.label, s.pct ? s.value.toFixed(2) + "%" : num(s.value)]));
  const ms = c.milestones || [];
  return `
  <div class="card"><h2>Stats</h2>
    <div class="grid">${stats.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("")}</div>
  </div>
  <div class="card"><h2>Milestones</h2>
    ${ms.length ? ms.map(m => `<div class="row"><div class="grow">🎖️ Level <b>${m.level}</b> <span class="muted">${esc(m.zone || "")}</span></div>
      <div class="side">${new Date(m.t * 1000).toLocaleDateString()}</div></div>`).join("")
      : `<div class="empty">Milestones show up at level 10, 20, 30…</div>`}
  </div>`;
}

function renderGear(c) {
  if (!c.gear.length) return `<div class="card"><div class="empty">No gear saved yet.</div></div>`;
  return `<div class="card"><h2>Equipment ${c.ilvl ? `<span>item level ${c.ilvl}</span>` : ""}</h2>
    ${c.gear.map(g => {
      const name = `<span style="color:${QUALITY[g.q] || "#fff"}">${esc(g.name || "item " + g.id)}</span>`;
      const link = data.itemUrl && g.id ? `<a href="${esc(data.itemUrl.replace("{id}", g.id))}" target="_blank" rel="noopener">${name}</a>` : name;
      return `<div class="row"><div class="slot">${esc(g.label)}</div><div class="grow name">${link}</div><div class="side">${g.ilvl ?? ""}</div></div>`;
    }).join("")}</div>`;
}

function renderGuild(c) {
  const g = c.guild;
  if (!g) return `<div class="card"><div class="empty">${esc(c.name)} isn't in a guild, or the roster hasn't been saved yet (it saves when you log out or /reload).</div></div>`;
  const q = guildQuery.toLowerCase();
  const members = g.members
    .filter(m => !q || [m.name, m.rank, m.zone, m.note].some(v => (v || "").toLowerCase().includes(q)))
    .sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0) || (a.online ? (b.level || 0) - (a.level || 0) : (a.away ?? 9e9) - (b.away ?? 9e9)));
  const shown = members.slice(0, guildLimit);
  return `
  <div class="card"><h2>${esc(g.name)} <span>${g.onlineCount} of ${g.members.length} online</span></h2>
    ${g.motd ? `<div class="motd">${esc(g.motd)}</div>` : ""}
    <div class="muted small">Your rank: <b style="color:var(--text)">${esc(g.rank || "?")}</b> · roster saved ${esc(ago(g.t))}</div>
  </div>
  <div class="card">
    <input type="search" id="gq" placeholder="Search name, rank, zone, note" value="${esc(guildQuery)}">
    ${shown.map(m => `<div class="row">
      ${m.online ? '<span class="dot"></span>' : '<span class="dot" style="background:#555;box-shadow:none"></span>'}
      <div class="grow"><div class="name"><b style="color:${CLASS_COLORS[m.class] || "var(--text)"}">${esc(m.name)}</b>
        <span class="muted small">${m.level ?? ""} · ${esc(m.rank || "")}</span></div>
        ${m.note ? `<div class="muted small name">${esc(m.note)}</div>` : ""}</div>
      <div class="side">${m.online ? esc(m.zone || "") : esc(away(m.away))}</div></div>`).join("")}
    ${!shown.length ? `<div class="empty">Nobody matches.</div>` : ""}
    ${members.length > shown.length ? `<button class="more" id="more">Show all ${members.length}</button>` : ""}
  </div>`;
}

function renderKills(c) {
  const link = k => !k.pvp && k.npc && data.npcUrl ? data.npcUrl.replace("{id}", k.npc) : null;
  return `
  <div class="card"><h2>First kills <span>${c.killCount} mobs · ${c.pvpCount} ${c.pvpCount === 1 ? "player" : "players"}</span></h2>
    ${c.kills.length ? c.kills.map(k => {
      const name = esc(k.name), url = link(k);
      return `<div class="row"><div class="grow"><div class="name">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${name}</a>` : name}
        ${k.boss ? '<span class="tag boss">BOSS</span>' : ""}${k.pvp ? '<span class="tag pvp">PvP</span>' : ""}</div>
        <div class="muted small name">${esc(k.zone || "")}</div></div>
        <div class="side">#${k.n ?? "?"}<br>${esc(ago(k.t))}</div></div>`;
    }).join("") : `<div class="empty">No first kills recorded yet.</div>`}
  </div>`;
}

const TABS = { overview: renderOverview, gear: renderGear, guild: renderGuild, kills: renderKills };

function render() {
  if (!data) return;
  const foot = document.getElementById("foot");
  if (!data.characters.length) {
    document.getElementById("hero").innerHTML = `<div class="card"><div class="empty">No characters yet.<br>
      Log in with the Herald addon on, then log out or type <b>/reload</b>.</div></div>`;
    return;
  }
  const c = current();
  document.documentElement.style.setProperty("--accent", c.color);
  renderChars();
  renderHero(c);
  if (widgetMode) return;
  document.getElementById("tab").innerHTML = TABS[state.tab](c);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  foot.textContent = "Stats, gold and gear update when you log out or /reload in game.";
  const gq = document.getElementById("gq");
  if (gq) gq.oninput = () => {
    guildQuery = gq.value; const pos = gq.selectionStart; render();
    const n = document.getElementById("gq"); n.focus(); n.setSelectionRange(pos, pos);
  };
  const more = document.getElementById("more");
  if (more) more.onclick = () => { guildLimit = 1e9; render(); };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  state.tab = b.dataset.tab; save("tab", state.tab); render(); window.scrollTo(0, 0);
});
if (widgetMode) document.body.classList.add("widget");

async function refresh() {
  try {
    const r = await fetch("/api/characters.json", { cache: "no-store" });
    data = await r.json();
    if (document.activeElement?.id !== "gq") render();
  } catch (e) {
    document.getElementById("foot").textContent = "Can't reach Herald on your PC. Is it running, and are you on the same Wi-Fi?";
  }
}
refresh();
setInterval(refresh, widgetMode ? 60000 : 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
